<script>
// Global variables
let allContentData = [];
let currentEditId = null;
let currentView = 'list';
let currentCalendarDate = new Date();
let currentTheme = localStorage.getItem('theme') || 'light';
let currentThemeColor = localStorage.getItem('themeColor') || 'indigo';
let touchStartX = 0;
let touchEndX = 0;

// Initialize when page loads
window.onload = function() {
  initTheme();
  initPWA();
  loadData();
  loadStatistics();
  renderCalendar();
  setupGestureControls();
};

// Initialize Theme
function initTheme() {
  // Apply saved theme
  if (currentTheme === 'dark') {
    document.body.classList.add('dark-mode');
    updateThemeIcon(true);
  }
  
  // Apply saved theme color
  applyThemeColor(currentThemeColor);
  
  // Check system preference if no saved theme
  if (!localStorage.getItem('theme') && window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches) {
    toggleTheme();
  }
}

// Apply theme color
function applyThemeColor(color) {
  const colorMap = {
    'indigo': '#6366f1',
    'blue': '#3b82f6',
    'purple': '#a855f7',
    'pink': '#ec4899',
    'green': '#10b981',
    'orange': '#f97316'
  };
  
  const primaryColor = colorMap[color] || colorMap['indigo'];
  const primaryDark = adjustColorBrightness(primaryColor, -20);
  
  document.documentElement.style.setProperty('--primary-color', primaryColor);
  document.documentElement.style.setProperty('--primary-dark', primaryDark);
  document.documentElement.style.setProperty('--primary-light', adjustColorBrightness(primaryColor, 20));
}

function adjustColorBrightness(hex, percent) {
  const num = parseInt(hex.slice(1), 16);
  const amt = Math.round(2.55 * percent);
  const R = Math.max(0, (num >> 16) + amt);
  const G = Math.max(0, (num >> 8 & 0x00FF) + amt);
  const B = Math.max(0, (num & 0x0000FF) + amt);
  return `#${(0x1000000 + (R < 255 ? R : 255) * 0x10000 + (G < 255 ? G : 255) * 0x100 + (B < 255 ? B : 255)).toString(16).slice(1)}`;
}

// Initialize PWA
function initPWA() {
  // Register inline Service Worker via Blob
  if ('serviceWorker' in navigator) {
    const swCode = `
      const CACHE_NAME = 'konten-planner-v1';
      
      self.addEventListener('install', event => {
        self.skipWaiting();
      });
      
      self.addEventListener('activate', event => {
        event.waitUntil(
          caches.keys().then(cacheNames => {
            return Promise.all(
              cacheNames.filter(name => name !== CACHE_NAME).map(name => caches.delete(name))
            );
          })
        );
        self.clients.claim();
      });
      
      self.addEventListener('fetch', event => {
        if (event.request.method !== 'GET') return;
        event.respondWith(
          fetch(event.request).then(response => {
            const clone = response.clone();
            caches.open(CACHE_NAME).then(cache => cache.put(event.request, clone));
            return response;
          }).catch(() => caches.match(event.request))
        );
      });
    `;
    
    const blob = new Blob([swCode], { type: 'application/javascript' });
    const swUrl = URL.createObjectURL(blob);
    
    navigator.serviceWorker.register(swUrl, { scope: '/' }).then(reg => {
      console.log('PWA: Service Worker registered');
    }).catch(err => {
      console.log('PWA: SW registration failed (normal in Apps Script iframe):', err.message);
    });
  }
  
  // Save app data periodically
  setInterval(saveAppState, 300000); // Every 5 minutes
}

function saveAppState() {
  localStorage.setItem('appState', JSON.stringify({
    timestamp: new Date().toISOString(),
    lastSync: new Date().getTime()
  }));
}

// Setup Gesture Controls
function setupGestureControls() {
  const calendarDays = document.getElementById('calendarDays');
  if (calendarDays) {
    calendarDays.addEventListener('touchstart', e => {
      touchStartX = e.changedTouches[0].screenX;
    }, false);
    
    calendarDays.addEventListener('touchend', e => {
      touchEndX = e.changedTouches[0].screenX;
      handleSwipe();
    }, false);
  }
}

// Load all content data
function loadData() {
  showLoading(true);
  
  google.script.run
    .withSuccessHandler(function(data) {
      allContentData = data;
      displayData(data);
      showLoading(false);
    })
    .withFailureHandler(function(error) {
      showToast('Error memuat data: ' + error, 'error');
      showLoading(false);
    })
    .getAllContent();
}

// Display data in table
function displayData(data) {
  const tbody = document.getElementById('contentTableBody');
  const table = document.getElementById('contentTable');
  const noDataMsg = document.getElementById('noDataMessage');
  
  if (!data || data.length === 0) {
    table.style.display = 'none';
    noDataMsg.style.display = 'block';
    return;
  }
  
  table.style.display = 'table';
  noDataMsg.style.display = 'none';
  
  tbody.innerHTML = '';
  
  data.forEach(content => {
    const row = tbody.insertRow();
    
    // Tanggal Upload
    const cellDate = row.insertCell();
    cellDate.textContent = content.tanggalUpload || '-';
    
    // Hook
    const cellHook = row.insertCell();
    cellHook.className = 'text-preview';
    cellHook.textContent = content.hook || '-';
    cellHook.title = content.hook;
    
    // Body Utas
    const cellBody = row.insertCell();
    cellBody.className = 'text-preview';
    cellBody.textContent = content.bodyUtas || '-';
    cellBody.title = content.bodyUtas;
    
    // Soft Sell
    const cellSoftSell = row.insertCell();
    cellSoftSell.className = 'text-preview';
    cellSoftSell.textContent = content.softSell || '-';
    cellSoftSell.title = content.softSell;
    
    // Link
    const cellLink = row.insertCell();
    if (content.linkAffiliate) {
      const link = document.createElement('a');
      link.href = content.linkAffiliate;
      link.target = '_blank';
      link.textContent = 'Link';
      cellLink.appendChild(link);
    } else {
      cellLink.textContent = '-';
    }
    
    // Status
    const cellStatus = row.insertCell();
    const statusBadge = document.createElement('span');
    statusBadge.className = 'status-badge ' + getStatusClass(content.statusKonten);
    statusBadge.textContent = content.statusKonten || 'Draft';
    cellStatus.appendChild(statusBadge);
    
    // Kategori
    const cellKategori = row.insertCell();
    cellKategori.textContent = content.kategori || '-';
    
    // Actions
    const cellActions = row.insertCell();
    cellActions.className = 'action-buttons';
    
    const viewBtn = document.createElement('button');
    viewBtn.className = 'btn btn-view';
    viewBtn.textContent = '👁️ Lihat';
    viewBtn.onclick = function() { viewContent(content); };
    
    const editBtn = document.createElement('button');
    editBtn.className = 'btn btn-edit';
    editBtn.textContent = '✏️ Edit';
    editBtn.onclick = function() { editContent(content); };
    
    const deleteBtn = document.createElement('button');
    deleteBtn.className = 'btn btn-delete';
    deleteBtn.textContent = '🗑️ Hapus';
    deleteBtn.onclick = function() { deleteContent(content.id); };
    
    cellActions.appendChild(viewBtn);
    cellActions.appendChild(editBtn);
    cellActions.appendChild(deleteBtn);
  });
}

// Get status class for badge
function getStatusClass(status) {
  const statusMap = {
    'Draft': 'status-draft',
    'Terjadwal': 'status-terjadwal',
    'Dipublikasi': 'status-dipublikasi',
    'Arsip': 'status-arsip'
  };
  return statusMap[status] || 'status-draft';
}

// Load statistics
function loadStatistics() {
  google.script.run
    .withSuccessHandler(function(stats) {
      document.getElementById('totalKonten').textContent = stats.total || 0;
      document.getElementById('draftKonten').textContent = stats.draft || 0;
      document.getElementById('scheduledKonten').textContent = stats.scheduled || 0;
      document.getElementById('publishedKonten').textContent = stats.published || 0;
    })
    .withFailureHandler(function(error) {
      console.error('Error loading statistics:', error);
    })
    .getStatistics();
}

// Show add form
function showAddForm() {
  currentEditId = null;
  document.getElementById('formTitle').textContent = 'Tambah Konten Baru';
  document.getElementById('contentForm').reset();
  document.getElementById('contentId').value = '';
  document.getElementById('submitBtn').textContent = 'Simpan';
  
  // Set default date to today
  const today = new Date().toISOString().split('T')[0];
  document.getElementById('tanggalUpload').value = today;
  
  document.getElementById('formModal').style.display = 'block';
}

// Edit content
function editContent(content) {
  currentEditId = content.id;
  document.getElementById('formTitle').textContent = 'Edit Konten';
  document.getElementById('submitBtn').textContent = 'Update';
  
  // Fill form with content data
  document.getElementById('contentId').value = content.id;
  document.getElementById('tanggalUpload').value = content.tanggalUpload;
  document.getElementById('hook').value = content.hook;
  document.getElementById('bodyUtas').value = content.bodyUtas;
  document.getElementById('softSell').value = content.softSell;
  document.getElementById('linkAffiliate').value = content.linkAffiliate;
  document.getElementById('statusKonten').value = content.statusKonten;
  document.getElementById('kategori').value = content.kategori;
  document.getElementById('targetAudience').value = content.targetAudience;
  document.getElementById('hashtags').value = content.hashtags;
  document.getElementById('notes').value = content.notes;
  
  document.getElementById('formModal').style.display = 'block';
}

// View content details

  let detailsHTML = `
    <div style="padding: 20px;">
      <h3 style="margin-bottom: 20px; color: #1a202c;">Detail Konten</h3>
      
      <div style="margin-bottom: 15px;">
        <strong style="color: #4a5568;">ID:</strong><br>
        <span style="color: #718096;">${content.id}</span>
      </div>
      
      <div style="margin-bottom: 15px;">
        <strong style="color: #4a5568;">Tanggal Upload:</strong><br>
        <span style="color: #718096;">${content.tanggalUpload || '-'}</span>
      </div>
      
      <div style="margin-bottom: 15px;">
        <strong style="color: #4a5568;">Status:</strong><br>
        <span class="status-badge ${getStatusClass(content.statusKonten)}">${content.statusKonten}</span>
      </div>
      
      <div style="margin-bottom: 15px;">
        <strong style="color: #4a5568;">Hook:</strong><br>
        <p style="color: #2d3748; background: #f7fafc; padding: 12px; border-radius: 8px; white-space: pre-wrap;">${content.hook || '-'}</p>
      </div>
      
      <div style="margin-bottom: 15px;">
        <strong style="color: #4a5568;">Body Utas:</strong><br>
        <p style="color: #2d3748; background: #f7fafc; padding: 12px; border-radius: 8px; white-space: pre-wrap;">${content.bodyUtas || '-'}</p>
      </div>
      
      <div style="margin-bottom: 15px;">
        <strong style="color: #4a5568;">Soft Sell:</strong><br>
        <p style="color: #2d3748; background: #f7fafc; padding: 12px; border-radius: 8px; white-space: pre-wrap;">${content.softSell || '-'}</p>
      </div>
      
      <div style="margin-bottom: 15px;">
        <strong style="color: #4a5568;">Link Affiliate:</strong><br>
        ${content.linkAffiliate ? `<a href="${content.linkAffiliate}" target="_blank">${content.linkAffiliate}</a>` : '-'}
      </div>
      
      <div style="margin-bottom: 15px;">
        <strong style="color: #4a5568;">Kategori:</strong><br>
        <span style="color: #718096;">${content.kategori || '-'}</span>
      </div>
      
      <div style="margin-bottom: 15px;">
        <strong style="color: #4a5568;">Target Audience:</strong><br>
        <span style="color: #718096;">${content.targetAudience || '-'}</span>
      </div>
      
      <div style="margin-bottom: 15px;">
        <strong style="color: #4a5568;">Hashtags:</strong><br>
        <span style="color: #718096;">${content.hashtags || '-'}</span>
      </div>
      
      <div style="margin-bottom: 15px;">
        <strong style="color: #4a5568;">Notes:</strong><br>
        <p style="color: #718096; background: #f7fafc; padding: 12px; border-radius: 8px; white-space: pre-wrap;">${content.notes || '-'}</p>
      </div>
      
      <div style="margin-bottom: 15px;">
        <strong style="color: #4a5568;">Tanggal Dibuat:</strong><br>
        <span style="color: #718096;">${content.tanggalDibuat || '-'}</span>
      </div>
      
      <div style="margin-bottom: 15px;">
        <strong style="color: #4a5568;">Terakhir Diupdate:</strong><br>
        <span style="color: #718096;">${content.terakhirDiupdate || '-'}</span>
      </div>
      
      <div style="margin-top: 20px; text-align: right;">
        <button class="btn btn-secondary" onclick="closeViewModal()">Tutup</button>
      </div>
    </div>
  `;
  
  // Create modal for viewing
  const viewModal = document.createElement('div');
  viewModal.id = 'viewModal';
  viewModal.className = 'modal';
  viewModal.style.display = 'block';
  viewModal.innerHTML = `
    <div class="modal-content" style="max-width: 700px;">
      <div class="modal-header">
        <h2>Detail Konten</h2>
        <span class="close" onclick="closeViewModal()">×</span>
      </div>
      ${detailsHTML}
    </div>
  `;
  
  document.body.appendChild(viewModal);
}

// Close view modal
function closeViewModal() {
  const viewModal = document.getElementById('viewModal');
  if (viewModal) {
    viewModal.remove();
  }
}

// Delete content
function deleteContent(id) {
  if (!confirm('Apakah Anda yakin ingin menghapus konten ini?')) {
    return;
  }
  
  google.script.run
    .withSuccessHandler(function(result) {
      if (result.success) {
        showToast(result.message, 'success');
        loadData();
        loadStatistics();
      } else {
        showToast(result.message, 'error');
      }
    })
    .withFailureHandler(function(error) {
      showToast('Error: ' + error, 'error');
    })
    .deleteContent(id);
}

// Submit form
function submitForm(event) {
  event.preventDefault();
  
  const formData = {
    id: document.getElementById('contentId').value,
    tanggalUpload: document.getElementById('tanggalUpload').value,
    hook: document.getElementById('hook').value,
    bodyUtas: document.getElementById('bodyUtas').value,
    softSell: document.getElementById('softSell').value,
    linkAffiliate: document.getElementById('linkAffiliate').value,
    statusKonten: document.getElementById('statusKonten').value,
    kategori: document.getElementById('kategori').value,
    targetAudience: document.getElementById('targetAudience').value,
    hashtags: document.getElementById('hashtags').value,
    notes: document.getElementById('notes').value
  };
  
  const isEdit = formData.id !== '';
  
  if (isEdit) {
    google.script.run
      .withSuccessHandler(function(result) {
        if (result.success) {
          showToast(result.message, 'success');
          closeModal();
          loadData();
          loadStatistics();
        } else {
          showToast(result.message, 'error');
        }
      })
      .withFailureHandler(function(error) {
        showToast('Error: ' + error, 'error');
      })
      .updateContent(formData);
  } else {
    google.script.run
      .withSuccessHandler(function(result) {
        if (result.success) {
          showToast(result.message, 'success');
          closeModal();
          loadData();
          loadStatistics();
        } else {
          showToast(result.message, 'error');
        }
      })
      .withFailureHandler(function(error) {
        showToast('Error: ' + error, 'error');
      })
      .addContent(formData);
  }
}

// Close modal
function closeModal() {
  document.getElementById('formModal').style.display = 'none';
  document.getElementById('contentForm').reset();
  currentEditId = null;
}

// Filter by status
function filterByStatus() {
  const status = document.getElementById('filterStatus').value;
  
  if (status === 'Semua') {
    displayData(allContentData);
  } else {
    const filteredData = allContentData.filter(content => content.statusKonten === status);
    displayData(filteredData);
  }
}

// Refresh data
function refreshData() {
  showToast('Memuat ulang data...', 'info');
  loadData();
  loadStatistics();
  document.getElementById('filterStatus').value = 'Semua';
}

// Show loading indicator
function showLoading(show) {
  document.getElementById('loadingIndicator').style.display = show ? 'block' : 'none';
}

// Show toast notification
function showToast(message, type = 'info') {
  const toast = document.getElementById('toast');
  toast.textContent = message;
  toast.className = 'toast ' + type;
  toast.style.display = 'block';
  
  setTimeout(function() {
    toast.style.display = 'none';
  }, 3000);
}

// Switch between list and calendar view
function switchView(view) {
  currentView = view;
  
  // Update toggle buttons
  document.querySelectorAll('.view-toggle-btn').forEach(btn => {
    btn.classList.remove('active');
    if (btn.getAttribute('data-view') === view) {
      btn.classList.add('active');
    }
  });
  
  // Show/hide views
  document.getElementById('listView').style.display = view === 'list' ? 'block' : 'none';
  document.getElementById('calendarView').style.display = view === 'calendar' ? 'block' : 'none';
  
  if (view === 'calendar') {
    renderCalendar();
  }
}

// Calendar Functions
function renderCalendar() {
  const year = currentCalendarDate.getFullYear();
  const month = currentCalendarDate.getMonth();
  
  // Update month/year display
  const monthNames = ['Januari', 'Februari', 'Maret', 'April', 'Mei', 'Juni', 
                      'Juli', 'Agustus', 'September', 'Oktober', 'November', 'Desember'];
  document.getElementById('calendarMonthYear').textContent = `${monthNames[month]} ${year}`;
  
  // Get first day of month and number of days
  const firstDay = new Date(year, month, 1).getDay();
  const daysInMonth = new Date(year, month + 1, 0).getDate();
  const daysInPrevMonth = new Date(year, month, 0).getDate();
  
  const calendarDays = document.getElementById('calendarDays');
  calendarDays.innerHTML = '';
  
  // Previous month days
  for (let i = firstDay - 1; i >= 0; i--) {
    const day = daysInPrevMonth - i;
    const dayEl = createCalendarDay(day, true);
    calendarDays.appendChild(dayEl);
  }
  
  // Current month days
  const today = new Date();
  for (let day = 1; day <= daysInMonth; day++) {
    const date = new Date(year, month, day);
    const dateString = formatDateForComparison(date);
    const isToday = date.toDateString() === today.toDateString();
    
    // Get content for this date
    const dayContent = allContentData.filter(content => {
      return content.tanggalUpload === dateString;
    });
    
    const dayEl = createCalendarDay(day, false, isToday, dayContent, date);
    calendarDays.appendChild(dayEl);
  }
  
  // Next month days
  const totalCells = calendarDays.children.length;
  const remainingCells = 42 - totalCells; // 6 rows * 7 days
  for (let day = 1; day <= remainingCells; day++) {
    const dayEl = createCalendarDay(day, true);
    calendarDays.appendChild(dayEl);
  }
}

function createCalendarDay(day, isOtherMonth, isToday = false, content = [], date = null) {
  const dayEl = document.createElement('div');
  dayEl.className = 'calendar-day';
  
  if (isOtherMonth) {
    dayEl.classList.add('other-month');
  }
  
  if (isToday) {
    dayEl.classList.add('today');
  }
  
  const dayNumber = document.createElement('div');
  dayNumber.className = 'calendar-day-number';
  dayNumber.textContent = day;
  dayEl.appendChild(dayNumber);
  
  if (!isOtherMonth && content.length > 0) {
    const contentContainer = document.createElement('div');
    contentContainer.className = 'calendar-day-content';
    
    // Show max 3 items
    const maxShow = 3;
    content.slice(0, maxShow).forEach(item => {
      const badge = document.createElement('div');
      badge.className = `calendar-content-badge ${getStatusSlug(item.statusKonten)}`;
      badge.textContent = item.hook.substring(0, 20) + '...';
      badge.title = item.hook;
      contentContainer.appendChild(badge);
    });
    
    if (content.length > maxShow) {
      const countEl = document.createElement('div');
      countEl.className = 'calendar-content-count';
      countEl.textContent = `+${content.length - maxShow} lainnya`;
      contentContainer.appendChild(countEl);
    }
    
    dayEl.appendChild(contentContainer);
    
    // Add click handler
    dayEl.style.cursor = 'pointer';
    dayEl.onclick = function() {
      showCalendarContent(date, content);
    };
  }
  
  return dayEl;
}

function getStatusSlug(status) {
  const slugMap = {
    'Draft': 'draft',
    'Terjadwal': 'scheduled',
    'Dipublikasi': 'published',
    'Arsip': 'archived'
  };
  return slugMap[status] || 'draft';
}

function formatDateForComparison(date) {
  const year = date.getFullYear();
  const month = String(date.getMonth() + 1).padStart(2, '0');
  const day = String(date.getDate()).padStart(2, '0');
  return `${year}-${month}-${day}`;
}

function previousMonth() {
  currentCalendarDate.setMonth(currentCalendarDate.getMonth() - 1);
  renderCalendar();
}

function nextMonth() {
  currentCalendarDate.setMonth(currentCalendarDate.getMonth() + 1);
  renderCalendar();
}

function showCalendarContent(date, content) {
  const monthNames = ['Januari', 'Februari', 'Maret', 'April', 'Mei', 'Juni', 
                      'Juli', 'Agustus', 'September', 'Oktober', 'November', 'Desember'];
  
  const dateString = `${date.getDate()} ${monthNames[date.getMonth()]} ${date.getFullYear()}`;
  document.getElementById('calendarContentTitle').textContent = `Konten - ${dateString}`;
  
  const contentBody = document.getElementById('calendarContentBody');
  contentBody.innerHTML = '';
  
  if (content.length === 0) {
    contentBody.innerHTML = '<div class="no-data"><p>Tidak ada konten untuk tanggal ini</p></div>';
  } else {
    content.forEach(item => {
      const contentCard = document.createElement('div');
      contentCard.style.cssText = 'border: 1px solid var(--border-color); border-radius: var(--radius-md); padding: 16px; margin-bottom: 12px; background: var(--light-bg); position: relative; touch-action: pan-y;';
      contentCard.setAttribute('data-swipe-item', item.id);
      
      let startX = 0;
      contentCard.addEventListener('touchstart', (e) => {
        startX = e.touches[0].clientX;
      });
      
      contentCard.addEventListener('touchend', (e) => {
        const endX = e.changedTouches[0].clientX;
        if (startX - endX > 100) {
          // Swipe left - show delete option
          showSwipeDelete(contentCard, item.id);
        }
      });
      
      contentCard.innerHTML = `
        <div style="display: flex; justify-content: space-between; align-items: start; margin-bottom: 12px;">
          <div>
            <span class="status-badge status-${getStatusSlug(item.statusKonten)}">${item.statusKonten}</span>
          </div>
          <div style="display: flex; gap: 6px;">
            <button class="btn btn-view" onclick="viewContent(${JSON.stringify(item).replace(/"/g, '&quot;')})">👁️</button>
            <button class="btn btn-edit" onclick="editContent(${JSON.stringify(item).replace(/"/g, '&quot;')})">✏️</button>
            <button class="btn btn-delete" onclick="deleteContent('${item.id}')">🗑️</button>
          </div>
        </div>
        <div style="margin-bottom: 8px;">
          <strong style="color: var(--text-primary);">Hook:</strong><br>
          <span style="color: var(--text-secondary); word-break: break-word;">${item.hook}</span>
        </div>
        <div style="margin-bottom: 8px;">
          <strong style="color: var(--text-primary);">Body:</strong><br>
          <span style="color: var(--text-secondary); word-break: break-word;">${item.bodyUtas.substring(0, 100)}...</span>
        </div>
        ${item.kategori ? `<div style="font-size: 12px; color: var(--text-muted);">📁 ${item.kategori}</div>` : ''}
      `;
      
      contentBody.appendChild(contentCard);
    });
  }
  
  document.getElementById('calendarContentModal').style.display = 'block';
}

function showSwipeDelete(card, itemId) {
  const deleteBtn = document.createElement('div');
  deleteBtn.style.cssText = 'position: absolute; top: 0; right: 0; bottom: 0; background: var(--danger-color); display: flex; align-items: center; justify-content: center; color: white; width: 70px; cursor: pointer; border-radius: var(--radius-md); animation: slideIn 0.2s ease;';
  deleteBtn.textContent = '🗑️ Hapus';
  deleteBtn.onclick = () => deleteContent(itemId);
  card.appendChild(deleteBtn);
}

function closeCalendarContentModal() {
  document.getElementById('calendarContentModal').style.display = 'none';
}

// Toggle theme (light/dark mode)
function toggleTheme() {
  const isDark = document.body.classList.toggle('dark-mode');
  currentTheme = isDark ? 'dark' : 'light';
  localStorage.setItem('theme', currentTheme);
  updateThemeIcon(isDark);
  showToast(`${isDark ? 'Dark' : 'Light'} mode aktif`, 'info');
}

function updateThemeIcon(isDark) {
  const sunIcon = document.getElementById('sunIcon');
  const moonIcon = document.getElementById('moonIcon');
  if (isDark) {
    sunIcon.style.display = 'none';
    moonIcon.style.display = 'block';
  } else {
    sunIcon.style.display = 'block';
    moonIcon.style.display = 'none';
  }
}

// Change theme color
function changeThemeColor(color) {
  currentThemeColor = color;
  localStorage.setItem('themeColor', color);
  applyThemeColor(color);
  toggleColorPicker();
  showToast(`Theme color berubah!`, 'success');
}

function toggleColorPicker() {
  const picker = document.getElementById('colorPicker');
  picker.style.display = picker.style.display === 'none' ? 'block' : 'none';
}

// Handle Swipe Gestures
function handleSwipe() {
  const swipeThreshold = 50;
  const diff = touchStartX - touchEndX;
  
  if (Math.abs(diff) > swipeThreshold) {
    if (diff > 0) {
      // Swipe left - next month
      nextMonth();
    } else {
      // Swipe right - previous month
      previousMonth();
    }
  }
}

// Close modal when clicking outside
window.onclick = function(event) {
  const modal = document.getElementById('formModal');
  if (event.target === modal) {
    closeModal();
  }
  
  const viewModal = document.getElementById('viewModal');
  if (event.target === viewModal) {
    closeViewModal();
  }
  
  const calendarModal = document.getElementById('calendarContentModal');
  if (event.target === calendarModal) {
    closeCalendarContentModal();
  }
}
</script>
