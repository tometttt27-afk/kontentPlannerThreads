<style>
:root {
  /* Light Mode Colors */
  --primary-color: #6366f1;
  --primary-dark: #4f46e5;
  --primary-light: #818cf8;
  --secondary-color: #8b5cf6;
  --success-color: #10b981;
  --warning-color: #f59e0b;
  --danger-color: #ef4444;
  --info-color: #3b82f6;
  
  /* Light Mode Backgrounds */
  --dark-bg: #0f172a;
  --dark-card: #1e293b;
  --light-bg: #f8fafc;
  --light-card: #ffffff;
  
  /* Text Colors */
  --text-primary: #1e293b;
  --text-secondary: #64748b;
  --text-muted: #94a3b8;
  --border-color: #e2e8f0;
  
  /* Shadows */
  --shadow-sm: 0 1px 2px 0 rgba(0, 0, 0, 0.05);
  --shadow-md: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
  --shadow-lg: 0 10px 15px -3px rgba(0, 0, 0, 0.1);
  --shadow-xl: 0 20px 25px -5px rgba(0, 0, 0, 0.1);
  
  /* Border Radius */
  --radius-sm: 8px;
  --radius-md: 12px;
  --radius-lg: 16px;
  --radius-xl: 20px;
}

/* Dark Mode Theme */
body.dark-mode {
  --dark-bg: #0f172a;
  --dark-card: #1e293b;
  --light-bg: #1e293b;
  --light-card: #0f172a;
  --text-primary: #f1f5f9;
  --text-secondary: #cbd5e1;
  --text-muted: #94a3b8;
  --border-color: #334155;
}

* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
}

html, body {
  width: 100%;
  overflow-x: hidden;
}

body {
  font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
  background: var(--light-bg);
  min-height: 100vh;
  padding: 12px;
  color: var(--text-primary);
  -webkit-font-smoothing: antialiased;
  -moz-osx-font-smoothing: grayscale;
  transition: background 0.3s ease;
  font-size: 16px; /* Prevent iOS zoom on input focus */
}

.container {
  width: 100%;
  margin: 0 auto;
  max-width: 100%;
  padding: 0;
}

/* ===== HEADER - MOBILE FIRST ===== */
.header {
  background: var(--light-card);
  border-radius: var(--radius-lg);
  padding: 16px;
  margin-bottom: 16px;
  box-shadow: var(--shadow-sm);
  border: 1px solid var(--border-color);
}

.header-content {
  display: flex;
  flex-direction: column;
  align-items: flex-start;
  gap: 12px;
  margin-bottom: 16px;
}

.header-left {
  width: 100%;
}

.logo-container {
  display: flex;
  align-items: center;
  gap: 12px;
}

.logo-icon {
  width: 40px;
  height: 40px;
  color: var(--primary-color);
  flex-shrink: 0;
}

.header-content h1 {
  font-size: 20px;
  color: var(--text-primary);
  font-weight: 700;
  letter-spacing: -0.5px;
  margin-bottom: 2px;
  line-height: 1.2;
}

.subtitle {
  color: var(--text-secondary);
  font-size: 12px;
  font-weight: 500;
}

.header-right {
  display: flex;
  align-items: center;
  gap: 8px;
  width: 100%;
  justify-content: flex-start;
}

/* Icon Buttons - Touch Friendly */
.btn-icon {
  width: 44px;
  height: 44px;
  min-width: 44px;
  min-height: 44px;
  border-radius: var(--radius-md);
  border: 1px solid var(--border-color);
  background: transparent;
  display: flex;
  align-items: center;
  justify-content: center;
  cursor: pointer;
  transition: all 0.2s ease;
  color: var(--text-secondary);
  -webkit-tap-highlight-color: transparent;
  flex-shrink: 0;
}

.btn-icon:active {
  background: var(--light-bg);
  color: var(--primary-color);
  border-color: var(--primary-color);
}

.btn-icon svg {
  width: 20px;
  height: 20px;
}

/* Stats Container - Responsive Grid */
.stats-container {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 12px;
}

.stat-card {
  background: var(--light-card);
  border: 1px solid var(--border-color);
  border-radius: var(--radius-md);
  padding: 12px;
  display: flex;
  align-items: center;
  gap: 12px;
  transition: all 0.3s ease;
  box-shadow: var(--shadow-sm);
}

.stat-card:active {
  transform: scale(0.98);
}

.stat-icon {
  font-size: 24px;
  width: 44px;
  height: 44px;
  display: flex;
  align-items: center;
  justify-content: center;
  border-radius: var(--radius-sm);
  background: var(--light-bg);
  flex-shrink: 0;
}

.stat-card-primary .stat-icon {
  background: rgba(99, 102, 241, 0.1);
}

.stat-card-warning .stat-icon {
  background: rgba(245, 158, 11, 0.1);
}

.stat-card-info .stat-icon {
  background: rgba(59, 130, 246, 0.1);
}

.stat-card-success .stat-icon {
  background: rgba(16, 185, 129, 0.1);
}

.stat-content {
  flex: 1;
  min-width: 0;
}

.stat-number {
  font-size: 22px;
  font-weight: 700;
  color: var(--text-primary);
  line-height: 1;
  margin-bottom: 2px;
}

.stat-label {
  font-size: 11px;
  color: var(--text-secondary);
  font-weight: 500;
  text-transform: uppercase;
  letter-spacing: 0.5px;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}

/* Desktop Breakpoint */
@media (min-width: 768px) {
  .header {
    padding: 24px;
    margin-bottom: 24px;
    border-radius: var(--radius-xl);
  }
  
  .header-content {
    flex-direction: row;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 24px;
  }
  
  .header-left {
    flex: 1;
  }
  
  .header-right {
    width: auto;
    justify-content: flex-end;
    gap: 12px;
  }
  
  .logo-icon {
    width: 48px;
    height: 48px;
  }
  
  .header-content h1 {
    font-size: 28px;
  }
  
  .subtitle {
    font-size: 14px;
  }
  
  .btn-icon:hover {
    background: var(--light-bg);
    color: var(--primary-color);
    border-color: var(--primary-color);
  }
  
  .btn-icon:active {
    transform: scale(0.95);
  }
  
  .stats-container {
    grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
    gap: 20px;
  }
  
  .stat-card {
    padding: 24px;
    border-radius: var(--radius-lg);
  }
  
  .stat-card:hover {
    transform: translateY(-4px);
    box-shadow: var(--shadow-lg);
  }
  
  .stat-icon {
    width: 56px;
    height: 56px;
    font-size: 32px;
  }
  
  .stat-number {
    font-size: 32px;
  }
  
  .stat-label {
    font-size: 13px;
  }
}

/* ===== VIEW TOGGLE - MOBILE FIRST ===== */
.view-toggle-container {
  margin-bottom: 12px;
  display: flex;
  flex-direction: column;
  gap: 12px;
}

.view-toggle {
  display: flex;
  background: var(--light-card);
  border: 1px solid var(--border-color);
  border-radius: var(--radius-md);
  padding: 4px;
  box-shadow: var(--shadow-sm);
  width: 100%;
  overflow-x: auto;
  -webkit-overflow-scrolling: touch;
}

.view-toggle-btn {
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 6px;
  padding: 10px 14px;
  border: none;
  background: transparent;
  border-radius: var(--radius-sm);
  cursor: pointer;
  font-size: 13px;
  font-weight: 500;
  color: var(--text-secondary);
  transition: all 0.2s ease;
  flex: 1;
  min-width: 70px;
  white-space: nowrap;
  -webkit-tap-highlight-color: transparent;
}

.view-toggle-btn svg {
  width: 16px;
  height: 16px;
}

.view-toggle-btn.active {
  background: var(--primary-color);
  color: white;
  box-shadow: var(--shadow-sm);
}

.view-toggle-btn:active {
  opacity: 0.8;
}

.layout-options {
  position: relative;
}

.btn-layout-toggle {
  width: 44px;
  height: 44px;
}

/* Desktop */
@media (min-width: 768px) {
  .view-toggle-container {
    margin-bottom: 24px;
    display: flex;
    flex-direction: row;
    justify-content: space-between;
    align-items: center;
    gap: 16px;
  }
  
  .view-toggle {
    width: auto;
    overflow-x: visible;
  }
  
  .view-toggle-btn {
    min-width: auto;
    padding: 10px 20px;
    font-size: 14px;
  }
  
  .view-toggle-btn:hover {
    background: var(--light-bg);
    color: var(--text-primary);
  }
  
  .view-toggle-btn.active:hover {
    background: var(--primary-dark);
  }
}

/* ===== ACTION BAR - MOBILE FIRST ===== */
.action-bar {
  background: var(--light-card);
  border: 1px solid var(--border-color);
  border-radius: var(--radius-md);
  padding: 12px;
  margin-bottom: 12px;
  display: flex;
  flex-direction: column;
  gap: 10px;
  align-items: stretch;
  box-shadow: var(--shadow-sm);
}

.filter-group {
  display: flex;
  align-items: center;
  gap: 8px;
  width: 100%;
  flex-direction: column;
}

.filter-group label {
  font-weight: 500;
  color: var(--text-secondary);
  font-size: 13px;
  align-self: flex-start;
}

.filter-group select {
  padding: 12px;
  border: 1px solid var(--border-color);
  border-radius: var(--radius-sm);
  font-size: 16px; /* Prevent zoom on iOS */
  cursor: pointer;
  background: white;
  color: var(--text-primary);
  font-weight: 500;
  transition: all 0.2s ease;
  width: 100%;
  -webkit-appearance: none;
  appearance: none;
}

.filter-group select:focus {
  outline: none;
  border-color: var(--primary-color);
  box-shadow: 0 0 0 3px rgba(99, 102, 241, 0.1);
}

/* Desktop */
@media (min-width: 768px) {
  .action-bar {
    flex-direction: row;
    align-items: center;
    padding: 20px;
    gap: 16px;
    margin-bottom: 24px;
    border-radius: var(--radius-lg);
  }
  
  .filter-group {
    flex-direction: row;
    margin-left: auto;
    width: auto;
  }
  
  .filter-group label {
    font-size: 14px;
    margin: 0;
  }
  
  .filter-group select {
    font-size: 14px;
    padding: 10px 16px;
    width: auto;
  }
}

/* ===== BUTTONS - MOBILE FIRST ===== */
.btn {
  padding: 12px 16px;
  border: none;
  border-radius: var(--radius-md);
  font-size: 14px;
  font-weight: 600;
  cursor: pointer;
  transition: all 0.2s ease;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 8px;
  touch-action: manipulation;
  -webkit-tap-highlight-color: transparent;
  user-select: none;
  box-shadow: var(--shadow-sm);
  min-height: 44px;
  width: 100%;
}

.btn-primary {
  background: var(--primary-color);
  color: white;
}

.btn-primary:active {
  background: var(--primary-dark);
  box-shadow: var(--shadow-md);
}

.btn-secondary {
  background: white;
  color: var(--text-primary);
  border: 1px solid var(--border-color);
}

.btn-secondary:active {
  background: var(--light-bg);
  border-color: var(--text-secondary);
}

.btn-edit {
  background: var(--success-color);
  color: white;
  padding: 10px 12px;
  font-size: 12px;
  min-height: auto;
  width: auto;
}

.btn-edit:active {
  background: #059669;
}

.btn-delete {
  background: var(--danger-color);
  color: white;
  padding: 10px 12px;
  font-size: 12px;
  min-height: auto;
  width: auto;
}

.btn-delete:active {
  background: #dc2626;
}

.btn-view {
  background: var(--info-color);
  color: white;
  padding: 10px 12px;
  font-size: 12px;
  min-height: auto;
  width: auto;
}

.btn-view:active {
  background: #2563eb;
}

.btn-sm {
  padding: 8px 12px;
  font-size: 12px;
  min-height: 40px;
}

/* Desktop */
@media (min-width: 768px) {
  .btn {
    width: auto;
    padding: 12px 24px;
  }
  
  .btn-primary:hover {
    background: var(--primary-dark);
    transform: translateY(-2px);
    box-shadow: var(--shadow-md);
  }
  
  .btn-secondary:hover {
    background: var(--light-bg);
    border-color: var(--text-secondary);
  }
  
  .btn-edit:hover {
    background: #059669;
  }
  
  .btn-delete:hover {
    background: #dc2626;
  }
  
  .btn-view:hover {
    background: #2563eb;
  }
}

/* ===== CALENDAR STYLES - MOBILE FIRST ===== */
.calendar-container {
  background: var(--light-card);
  border: 1px solid var(--border-color);
  border-radius: var(--radius-md);
  padding: 12px;
  box-shadow: var(--shadow-sm);
}

.calendar-header {
  display: flex;
  justify-content: space-between;
  align-items: center;
  margin-bottom: 16px;
  gap: 8px;
  flex-wrap: wrap;
}

.calendar-header h2 {
  font-size: 16px;
  font-weight: 700;
  color: var(--text-primary);
  flex: 1;
  min-width: 150px;
}

.calendar-header .btn-icon {
  width: 40px;
  height: 40px;
}

.calendar-weekdays {
  display: grid;
  grid-template-columns: repeat(7, 1fr);
  gap: 4px;
  margin-bottom: 8px;
}

.calendar-weekday {
  text-align: center;
  font-size: 11px;
  font-weight: 600;
  color: var(--text-secondary);
  text-transform: uppercase;
  letter-spacing: 0.5px;
  padding: 8px 0;
}

.calendar-days {
  display: grid;
  grid-template-columns: repeat(7, 1fr);
  gap: 4px;
  user-select: none;
}

.calendar-day {
  aspect-ratio: 1;
  border: 1px solid var(--border-color);
  border-radius: var(--radius-sm);
  padding: 6px;
  cursor: pointer;
  transition: all 0.2s ease;
  background: white;
  position: relative;
  min-height: 50px;
  display: flex;
  flex-direction: column;
  -webkit-tap-highlight-color: transparent;
}

.calendar-day:active {
  border-color: var(--primary-color);
  box-shadow: var(--shadow-md);
}

.calendar-day.other-month {
  opacity: 0.3;
  pointer-events: none;
}

.calendar-day.today {
  border-color: var(--primary-color);
  border-width: 2px;
  background: rgba(99, 102, 241, 0.05);
}

.calendar-day-number {
  font-size: 12px;
  font-weight: 600;
  color: var(--text-primary);
  margin-bottom: 3px;
}

.calendar-day-content {
  flex: 1;
  display: flex;
  flex-direction: column;
  gap: 2px;
  overflow: hidden;
}

.calendar-content-badge {
  font-size: 9px;
  padding: 2px 4px;
  border-radius: 3px;
  text-overflow: ellipsis;
  white-space: nowrap;
  overflow: hidden;
  font-weight: 500;
}

.calendar-content-badge.draft {
  background: rgba(148, 163, 184, 0.1);
  color: var(--text-secondary);
}

.calendar-content-badge.scheduled {
  background: rgba(245, 158, 11, 0.1);
  color: var(--warning-color);
}

.calendar-content-badge.published {
  background: rgba(16, 185, 129, 0.1);
  color: var(--success-color);
}

.calendar-content-count {
  font-size: 10px;
  color: var(--text-muted);
  margin-top: auto;
}

/* Desktop */
@media (min-width: 768px) {
  .calendar-container {
    border-radius: var(--radius-xl);
    padding: 32px;
  }
  
  .calendar-header {
    margin-bottom: 32px;
    gap: 16px;
  }
  
  .calendar-header h2 {
    font-size: 24px;
  }
  
  .calendar-weekdays {
    gap: 8px;
    margin-bottom: 16px;
  }
  
  .calendar-weekday {
    font-size: 13px;
    padding: 12px 0;
  }
  
  .calendar-days {
    gap: 8px;
  }
  
  .calendar-day {
    min-height: 80px;
    padding: 8px;
    border-radius: var(--radius-md);
  }
  
  .calendar-day:hover {
    border-color: var(--primary-color);
    box-shadow: var(--shadow-md);
    transform: scale(1.02);
  }
  
  .calendar-day-number {
    font-size: 14px;
    margin-bottom: 4px;
  }
  
  .calendar-content-badge {
    font-size: 10px;
    padding: 2px 6px;
    border-radius: 4px;
  }
}

/* ===== MODAL - MOBILE FIRST ===== */
.modal {
  display: none;
  position: fixed;
  z-index: 1000;
  left: 0;
  top: 0;
  width: 100%;
  height: 100%;
  background-color: rgba(15, 23, 42, 0.75);
  backdrop-filter: blur(8px);
  animation: fadeIn 0.2s ease;
  overflow-y: auto;
  -webkit-overflow-scrolling: touch;
  padding: 0;
}

@keyframes fadeIn {
  from { opacity: 0; }
  to { opacity: 1; }
}

.modal-content {
  background-color: var(--light-card);
  margin: 0;
  padding: 0;
  border-radius: 0;
  width: 100%;
  max-width: 100%;
  min-height: 100vh;
  overflow-y: visible;
  box-shadow: none;
  animation: slideUp 0.3s ease;
  border: none;
}

@keyframes slideUp {
  from {
    transform: translateY(50px);
    opacity: 0;
  }
  to {
    transform: translateY(0);
    opacity: 1;
  }
}

.modal-header {
  display: flex;
  justify-content: space-between;
  align-items: center;
  padding: 16px;
  border-bottom: 1px solid var(--border-color);
  background: var(--light-card);
  position: sticky;
  top: 0;
  z-index: 10;
}

.modal-header h2 {
  font-size: 18px;
  font-weight: 700;
  color: var(--text-primary);
  margin: 0;
}

.close {
  color: var(--text-secondary);
  font-size: 24px;
  font-weight: 300;
  cursor: pointer;
  transition: all 0.2s ease;
  line-height: 1;
  width: 40px;
  height: 40px;
  display: flex;
  align-items: center;
  justify-content: center;
  border-radius: var(--radius-sm);
  min-width: 40px;
  min-height: 40px;
  -webkit-tap-highlight-color: transparent;
}

.close:active {
  background: var(--light-bg);
  color: var(--text-primary);
}

.modal-body {
  padding: 16px;
}

/* Desktop */
@media (min-width: 768px) {
  .modal {
    padding: 40px 0;
    overflow-y: auto;
  }
  
  .modal-content {
    width: 90%;
    max-width: 800px;
    margin: 40px auto;
    border-radius: var(--radius-xl);
    border: 1px solid var(--border-color);
    box-shadow: var(--shadow-xl);
    min-height: auto;
    max-height: 90vh;
    overflow-y: auto;
  }
  
  .modal-header {
    padding: 24px 32px;
  }
  
  .modal-header h2 {
    font-size: 20px;
  }
  
  .close:hover {
    background: var(--light-bg);
    color: var(--text-primary);
  }
  
  .modal-body {
    padding: 32px;
  }
}

/* ===== FORM STYLES - MOBILE FIRST ===== */
form {
  padding: 16px;
  padding-bottom: 32px; /* Extra space at bottom for buttons */
}

.form-row {
  display: flex;
  flex-direction: column;
  gap: 0;
  margin-bottom: 0;
}

.form-group {
  margin-bottom: 16px;
}

.form-group label {
  display: block;
  margin-bottom: 8px;
  font-weight: 600;
  color: var(--text-primary);
  font-size: 14px;
}

.form-group input,
.form-group select,
.form-group textarea {
  width: 100%;
  padding: 12px;
  border: 1px solid var(--border-color);
  border-radius: var(--radius-md);
  font-size: 16px; /* Prevent iOS zoom */
  font-family: inherit;
  color: var(--text-primary);
  background: white;
  transition: all 0.2s ease;
  -webkit-appearance: none;
  appearance: none;
}

.form-group input:focus,
.form-group select:focus,
.form-group textarea:focus {
  outline: none;
  border-color: var(--primary-color);
  box-shadow: 0 0 0 3px rgba(99, 102, 241, 0.1);
}

.form-group textarea {
  resize: vertical;
  min-height: 100px;
}

.form-group small {
  display: block;
  margin-top: 6px;
  color: var(--text-muted);
  font-size: 12px;
}

.form-actions {
  display: flex;
  flex-direction: column;
  gap: 10px;
  margin-top: 24px;
  padding-top: 16px;
  padding-bottom: 20px;
  border-top: 1px solid var(--border-color);
}

/* Desktop */
@media (min-width: 768px) {
  form {
    padding: 32px;
    padding-bottom: 32px;
  }
  
  .form-row {
    flex-direction: row;
    gap: 20px;
    margin-bottom: 0;
  }
  
  .form-row > .form-group {
    flex: 1;
  }
  
  .form-group {
    margin-bottom: 20px;
  }
  
  .form-group label {
    font-size: 14px;
    margin-bottom: 8px;
  }
  
  .form-group input,
  .form-group select,
  .form-group textarea {
    font-size: 14px;
    padding: 12px 16px;
  }
  
  .form-actions {
    flex-direction: row;
    justify-content: flex-end;
    gap: 12px;
    margin-top: 32px;
    padding-top: 24px;
    padding-bottom: 0;
  }
  
  .form-actions .btn {
    width: auto;
  }
}

/* ===== TABLE STYLES - MOBILE FIRST ===== */
.table-container {
