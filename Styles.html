<style>
:root {
  --primary-color: #6366f1;
  --primary-dark: #4f46e5;
  --primary-light: #818cf8;
  --secondary-color: #8b5cf6;
  --success-color: #10b981;
  --warning-color: #f59e0b;
  --danger-color: #ef4444;
  --info-color: #3b82f6;
  --dark-bg: #0f172a;
  --dark-card: #1e293b;
  --light-bg: #f8fafc;
  --light-card: #ffffff;
  --text-primary: #1e293b;
  --text-secondary: #64748b;
  --text-muted: #94a3b8;
  --border-color: #e2e8f0;
  --shadow-sm: 0 1px 2px 0 rgba(0, 0, 0, 0.05);
  --shadow-md: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
  --shadow-lg: 0 10px 15px -3px rgba(0, 0, 0, 0.1);
  --shadow-xl: 0 20px 25px -5px rgba(0, 0, 0, 0.1);
  --radius-sm: 8px;
  --radius-md: 12px;
  --radius-lg: 16px;
  --radius-xl: 20px;
}

* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
}

body {
  font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
  background: var(--light-bg);
  min-height: 100vh;
  padding: 20px;
  color: var(--text-primary);
  -webkit-font-smoothing: antialiased;
  -moz-osx-font-smoothing: grayscale;
  transition: background 0.3s ease;
}

.container {
  max-width: 1400px;
  margin: 0 auto;
}

/* Header Styles - Modern & Clean */
.header {
  background: var(--light-card);
  border-radius: var(--radius-xl);
  padding: 32px;
  margin-bottom: 24px;
  box-shadow: var(--shadow-sm);
  border: 1px solid var(--border-color);
}

.header-content {
  display: flex;
  justify-content: space-between;
  align-items: center;
  margin-bottom: 32px;
}

.header-left {
  flex: 1;
}

.logo-container {
  display: flex;
  align-items: center;
  gap: 16px;
}

.logo-icon {
  width: 48px;
  height: 48px;
  color: var(--primary-color);
}

.header-content h1 {
  font-size: 28px;
  color: var(--text-primary);
  font-weight: 700;
  letter-spacing: -0.5px;
  margin-bottom: 4px;
}

.subtitle {
  color: var(--text-secondary);
  font-size: 14px;
  font-weight: 500;
}

.header-right {
  display: flex;
  align-items: center;
  gap: 12px;
}

/* Icon Buttons */
.btn-icon {
  width: 40px;
  height: 40px;
  border-radius: var(--radius-md);
  border: 1px solid var(--border-color);
  background: transparent;
  display: flex;
  align-items: center;
  justify-content: center;
  cursor: pointer;
  transition: all 0.2s ease;
  color: var(--text-secondary);
}

.btn-icon:hover {
  background: var(--light-bg);
  color: var(--primary-color);
  border-color: var(--primary-color);
}

.btn-icon svg {
  width: 20px;
  height: 20px;
}

/* Statistics Cards - Modern Design */
.stats-container {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
  gap: 20px;
}

.stat-card {
  background: var(--light-card);
  border: 1px solid var(--border-color);
  border-radius: var(--radius-lg);
  padding: 24px;
  display: flex;
  align-items: center;
  gap: 16px;
  transition: all 0.3s ease;
  box-shadow: var(--shadow-sm);
}

.stat-card:hover {
  transform: translateY(-4px);
  box-shadow: var(--shadow-lg);
}

.stat-icon {
  font-size: 32px;
  width: 56px;
  height: 56px;
  display: flex;
  align-items: center;
  justify-content: center;
  border-radius: var(--radius-md);
  background: var(--light-bg);
}

.stat-card-primary .stat-icon {
  background: rgba(99, 102, 241, 0.1);
}

.stat-card-warning .stat-icon {
  background: rgba(245, 158, 11, 0.1);
}

.stat-card-info .stat-icon {
  background: rgba(59, 130, 246, 0.1);
}

.stat-card-success .stat-icon {
  background: rgba(16, 185, 129, 0.1);
}

.stat-content {
  flex: 1;
}

.stat-number {
  font-size: 32px;
  font-weight: 700;
  color: var(--text-primary);
  line-height: 1;
  margin-bottom: 4px;
}

.stat-label {
  font-size: 13px;
  color: var(--text-secondary);
  font-weight: 500;
  text-transform: uppercase;
  letter-spacing: 0.5px;
}

/* View Toggle */
.view-toggle-container {
  margin-bottom: 24px;
}

.view-toggle {
  display: inline-flex;
  background: var(--light-card);
  border: 1px solid var(--border-color);
  border-radius: var(--radius-md);
  padding: 4px;
  box-shadow: var(--shadow-sm);
}

.view-toggle-btn {
  display: flex;
  align-items: center;
  gap: 8px;
  padding: 10px 20px;
  border: none;
  background: transparent;
  border-radius: var(--radius-sm);
  cursor: pointer;
  font-size: 14px;
  font-weight: 500;
  color: var(--text-secondary);
  transition: all 0.2s ease;
}

.view-toggle-btn svg {
  width: 18px;
  height: 18px;
}

.view-toggle-btn.active {
  background: var(--primary-color);
  color: white;
  box-shadow: var(--shadow-sm);
}

.view-toggle-btn:not(.active):hover {
  background: var(--light-bg);
  color: var(--text-primary);
}

/* Action Bar - Minimal */
.action-bar {
  background: var(--light-card);
  border: 1px solid var(--border-color);
  border-radius: var(--radius-lg);
  padding: 20px;
  margin-bottom: 24px;
  display: flex;
  gap: 16px;
  align-items: center;
  flex-wrap: wrap;
  box-shadow: var(--shadow-sm);
}

.filter-group {
  display: flex;
  align-items: center;
  gap: 12px;
  margin-left: auto;
}

.filter-group label {
  font-weight: 500;
  color: var(--text-secondary);
  font-size: 14px;
}

.filter-group select {
  padding: 10px 16px;
  border: 1px solid var(--border-color);
  border-radius: var(--radius-sm);
  font-size: 14px;
  cursor: pointer;
  background: white;
  color: var(--text-primary);
  font-weight: 500;
  transition: all 0.2s ease;
}

.filter-group select:focus {
  outline: none;
  border-color: var(--primary-color);
  box-shadow: 0 0 0 3px rgba(99, 102, 241, 0.1);
}

/* Modern Buttons */
.btn {
  padding: 12px 24px;
  border: none;
  border-radius: var(--radius-md);
  font-size: 14px;
  font-weight: 600;
  cursor: pointer;
  transition: all 0.2s ease;
  display: inline-flex;
  align-items: center;
  gap: 8px;
  touch-action: manipulation;
  -webkit-tap-highlight-color: transparent;
  user-select: none;
  box-shadow: var(--shadow-sm);
}

.btn-primary {
  background: var(--primary-color);
  color: white;
}

.btn-primary:hover {
  background: var(--primary-dark);
  transform: translateY(-2px);
  box-shadow: var(--shadow-md);
}

.btn-secondary {
  background: white;
  color: var(--text-primary);
  border: 1px solid var(--border-color);
}

.btn-secondary:hover {
  background: var(--light-bg);
  border-color: var(--text-secondary);
}

.btn-edit {
  background: var(--success-color);
  color: white;
  padding: 8px 16px;
  font-size: 13px;
}

.btn-edit:hover {
  background: #059669;
}

.btn-delete {
  background: var(--danger-color);
  color: white;
  padding: 8px 16px;
  font-size: 13px;
}

.btn-delete:hover {
  background: #dc2626;
}

.btn-view {
  background: var(--info-color);
  color: white;
  padding: 8px 16px;
  font-size: 13px;
}

.btn-view:hover {
  background: #2563eb;
}

/* Calendar Styles */
.calendar-container {
  background: var(--light-card);
  border: 1px solid var(--border-color);
  border-radius: var(--radius-xl);
  padding: 32px;
  box-shadow: var(--shadow-sm);
}

.calendar-header {
  display: flex;
  justify-content: space-between;
  align-items: center;
  margin-bottom: 32px;
}

.calendar-header h2 {
  font-size: 24px;
  font-weight: 700;
  color: var(--text-primary);
}

.calendar-weekdays {
  display: grid;
  grid-template-columns: repeat(7, 1fr);
  gap: 8px;
  margin-bottom: 16px;
}

.calendar-weekday {
  text-align: center;
  font-size: 13px;
  font-weight: 600;
  color: var(--text-secondary);
  text-transform: uppercase;
  letter-spacing: 0.5px;
  padding: 12px 0;
}

.calendar-days {
  display: grid;
  grid-template-columns: repeat(7, 1fr);
  gap: 8px;
}

.calendar-day {
  aspect-ratio: 1;
  border: 1px solid var(--border-color);
  border-radius: var(--radius-md);
  padding: 8px;
  cursor: pointer;
  transition: all 0.2s ease;
  background: white;
  position: relative;
  min-height: 80px;
  display: flex;
  flex-direction: column;
}

.calendar-day:hover {
  border-color: var(--primary-color);
  box-shadow: var(--shadow-md);
  transform: scale(1.02);
}

.calendar-day.other-month {
  opacity: 0.3;
  pointer-events: none;
}

.calendar-day.today {
  border-color: var(--primary-color);
  border-width: 2px;
  background: rgba(99, 102, 241, 0.05);
}

.calendar-day-number {
  font-size: 14px;
  font-weight: 600;
  color: var(--text-primary);
  margin-bottom: 4px;
}

.calendar-day-content {
  flex: 1;
  display: flex;
  flex-direction: column;
  gap: 2px;
  overflow: hidden;
}

.calendar-content-badge {
  font-size: 10px;
  padding: 2px 6px;
  border-radius: 4px;
  text-overflow: ellipsis;
  white-space: nowrap;
  overflow: hidden;
  font-weight: 500;
}

.calendar-content-badge.draft {
  background: rgba(148, 163, 184, 0.1);
  color: var(--text-secondary);
}

.calendar-content-badge.scheduled {
  background: rgba(245, 158, 11, 0.1);
  color: var(--warning-color);
}

.calendar-content-badge.published {
  background: rgba(16, 185, 129, 0.1);
  color: var(--success-color);
}

.calendar-content-count {
  font-size: 11px;
  color: var(--text-muted);
  margin-top: auto;
}

/* Modal - Modern Design */
.modal {
  display: none;
  position: fixed;
  z-index: 1000;
  left: 0;
  top: 0;
  width: 100%;
  height: 100%;
  background-color: rgba(15, 23, 42, 0.75);
  backdrop-filter: blur(8px);
  animation: fadeIn 0.2s ease;
}

@keyframes fadeIn {
  from {
    opacity: 0;
  }
  to {
    opacity: 1;
  }
}

.modal-content {
  background-color: var(--light-card);
  margin: 40px auto;
  padding: 0;
  border-radius: var(--radius-xl);
  width: 90%;
  max-width: 800px;
  max-height: 90vh;
  overflow-y: auto;
  box-shadow: var(--shadow-xl);
  animation: slideUp 0.3s ease;
  border: 1px solid var(--border-color);
}

@keyframes slideUp {
  from {
    transform: translateY(50px);
    opacity: 0;
  }
  to {
    transform: translateY(0);
    opacity: 1;
  }
}

.modal-header {
  display: flex;
  justify-content: space-between;
  align-items: center;
  padding: 24px 32px;
  border-bottom: 1px solid var(--border-color);
}

.modal-header h2 {
  font-size: 20px;
  font-weight: 700;
  color: var(--text-primary);
}

.close {
  color: var(--text-secondary);
  font-size: 28px;
  font-weight: 300;
  cursor: pointer;
  transition: all 0.2s ease;
  line-height: 1;
  width: 32px;
  height: 32px;
  display: flex;
  align-items: center;
  justify-content: center;
  border-radius: var(--radius-sm);
}

.close:hover {
  background: var(--light-bg);
  color: var(--text-primary);
}

.modal-body {
  padding: 32px;
}

/* Form Styles - Clean & Minimal */
form {
  padding: 32px;
}

.form-row {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 20px;
  margin-bottom: 20px;
}

.form-group {
  margin-bottom: 20px;
}

.form-group label {
  display: block;
  margin-bottom: 8px;
  font-weight: 600;
  color: var(--text-primary);
  font-size: 14px;
}

.form-group input,
.form-group select,
.form-group textarea {
  width: 100%;
  padding: 12px 16px;
  border: 1px solid var(--border-color);
  border-radius: var(--radius-md);
  font-size: 14px;
  font-family: inherit;
  color: var(--text-primary);
  background: white;
  transition: all 0.2s ease;
}

.form-group input:focus,
.form-group select:focus,
.form-group textarea:focus {
  outline: none;
  border-color: var(--primary-color);
  box-shadow: 0 0 0 3px rgba(99, 102, 241, 0.1);
}

.form-group textarea {
  resize: vertical;
  min-height: 100px;
}

.form-group small {
  display: block;
  margin-top: 6px;
  color: var(--text-muted);
  font-size: 12px;
}

.form-actions {
  display: flex;
  gap: 12px;
  justify-content: flex-end;
  margin-top: 32px;
  padding-top: 24px;
  border-top: 1px solid var(--border-color);
}

/* Table Styles - Clean Design */
.table-container {
  background: var(--light-card);
  border: 1px solid var(--border-color);
  border-radius: var(--radius-xl);
  padding: 24px;
  box-shadow: var(--shadow-sm);
  overflow-x: auto;
  -webkit-overflow-scrolling: touch;
}

table {
  width: 100%;
  border-collapse: separate;
  border-spacing: 0;
}

thead th {
  background: var(--light-bg);
  color: var(--text-secondary);
  padding: 16px;
  text-align: left;
  font-weight: 600;
  font-size: 12px;
  text-transform: uppercase;
  letter-spacing: 0.5px;
  border-bottom: 1px solid var(--border-color);
}

thead th:first-child {
  border-radius: var(--radius-sm) 0 0 0;
}

thead th:last-child {
  border-radius: 0 var(--radius-sm) 0 0;
}

tbody tr {
  border-bottom: 1px solid var(--border-color);
  transition: background-color 0.2s ease;
}

tbody tr:hover {
  background-color: var(--light-bg);
}

tbody tr:last-child {
  border-bottom: none;
}

tbody td {
  padding: 16px;
  font-size: 14px;
  color: var(--text-primary);
}

tbody td.text-preview {
  max-width: 250px;
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}

/* Status Badge - Modern */
.status-badge {
  display: inline-flex;
  align-items: center;
  padding: 6px 12px;
  border-radius: 20px;
  font-size: 12px;
  font-weight: 600;
  text-transform: capitalize;
}

.status-draft {
  background: rgba(148, 163, 184, 0.1);
  color: var(--text-secondary);
}

.status-terjadwal {
  background: rgba(245, 158, 11, 0.1);
  color: var(--warning-color);
}

.status-dipublikasi {
  background: rgba(16, 185, 129, 0.1);
  color: var(--success-color);
}

.status-arsip {
  background: rgba(139, 92, 246, 0.1);
  color: var(--secondary-color);
}

.action-buttons {
  display: flex;
  gap: 8px;
  flex-wrap: wrap;
}

/* Loading & Messages */
.loading {
  text-align: center;
  padding: 80px 20px;
  color: var(--text-secondary);
}

.spinner {
  border: 3px solid var(--border-color);
  border-top: 3px solid var(--primary-color);
  border-radius: 50%;
  width: 48px;
  height: 48px;
  animation: spin 0.8s linear infinite;
  margin: 0 auto 20px;
}

@keyframes spin {
  0% {
    transform: rotate(0deg);
  }
  100% {
    transform: rotate(360deg);
  }
}

.no-data {
  text-align: center;
  padding: 80px 20px;
}

.no-data-icon {
  font-size: 64px;
  margin-bottom: 16px;
}

.no-data h3 {
  font-size: 20px;
  font-weight: 700;
  color: var(--text-primary);
  margin-bottom: 8px;
}

.no-data p {
  color: var(--text-secondary);
  font-size: 14px;
}

/* Toast Notification - Modern */
.toast {
  position: fixed;
  bottom: 30px;
  right: 30px;
  background: var(--dark-bg);
  color: white;
  padding: 16px 24px;
  border-radius: var(--radius-md);
  box-shadow: var(--shadow-xl);
  display: none;
  z-index: 2000;
  animation: slideInUp 0.3s ease;
  border: 1px solid rgba(255, 255, 255, 0.1);
}

@keyframes slideInUp {
  from {
    transform: translateY(100px);
    opacity: 0;
  }
  to {
    transform: translateY(0);
    opacity: 1;
  }
}

.toast.success {
  background: var(--success-color);
}

.toast.error {
  background: var(--danger-color);
}

.toast.info {
  background: var(--info-color);
}

/* Links */
a {
  color: var(--primary-color);
  text-decoration: none;
  font-weight: 500;
  transition: color 0.2s ease;
}

a:hover {
  color: var(--primary-dark);
}

/* Mobile Scroll Hint */
.mobile-scroll-hint {
  display: none;
  text-align: center;
  padding: 12px;
  color: var(--text-muted);
  font-size: 12px;
  background: var(--light-bg);
  border-radius: var(--radius-sm);
  margin-bottom: 16px;
  border: 1px dashed var(--border-color);
}

/* Utility Classes */
.desktop-only {
  display: block;
}

.mobile-only {
  display: none;
}

/* Responsive Design */
@media (max-width: 1200px) {
  .container {
    padding: 0 10px;
  }
}

@media (max-width: 992px) {
  .stats-container {
    grid-template-columns: repeat(2, 1fr);
  }
  
  .calendar-day {
    min-height: 60px;
  }
}

@media (max-width: 768px) {
  body {
    padding: 12px;
  }
  
  .header {
    padding: 24px 20px;
  }
  
  .header-content {
    flex-direction: column;
    align-items: flex-start;
    gap: 16px;
  }
  
  .logo-container {
    gap: 12px;
  }
  
  .logo-icon {
    width: 40px;
    height: 40px;
  }
  
  .header-content h1 {
    font-size: 22px;
  }
  
  .subtitle {
    font-size: 13px;
  }
  
  .stats-container {
    grid-template-columns: repeat(2, 1fr);
    gap: 12px;
  }
  
  .stat-card {
    padding: 16px;
  }
  
  .stat-icon {
    width: 48px;
    height: 48px;
    font-size: 24px;
  }
  
  .stat-number {
    font-size: 24px;
  }
  
  .stat-label {
    font-size: 11px;
  }
  
  .view-toggle {
    width: 100%;
  }
  
  .view-toggle-btn {
    flex: 1;
    justify-content: center;
  }
  
  .action-bar {
    flex-direction: column;
    align-items: stretch;
    padding: 16px;
    gap: 12px;
  }
  
  .filter-group {
    margin-left: 0;
    width: 100%;
  }
  
  .filter-group select {
    flex: 1;
  }
  
  .btn {
    width: 100%;
    justify-content: center;
  }
  
  .form-row {
    grid-template-columns: 1fr;
    gap: 0;
  }
  
  .modal-content {
    width: 95%;
    margin: 20px auto;
    max-height: 85vh;
  }
  
  .modal-header,
  .modal-body,
  form {
    padding: 20px;
  }
  
  .table-container {
    padding: 16px;
  }
  
  table {
    font-size: 13px;
    min-width: 800px;
  }
  
  thead th,
  tbody td {
    padding: 12px 8px;
  }
  
  .action-buttons {
    flex-direction: column;
  }
  
  .action-buttons .btn {
    width: 100%;
  }
  
  .toast {
    right: 12px;
    left: 12px;
    bottom: 12px;
  }
  
  .mobile-scroll-hint {
    display: block;
  }
  
  .desktop-only {
    display: none;
  }
  
  .mobile-only {
    display: block;
  }
  
  .calendar-container {
    padding: 20px 16px;
  }
  
  .calendar-header h2 {
    font-size: 18px;
  }
  
  .calendar-weekday {
    font-size: 11px;
    padding: 8px 0;
  }
  
  .calendar-days {
    gap: 4px;
  }
  
  .calendar-day {
    min-height: 50px;
    padding: 4px;
  }
  
  .calendar-day-number {
    font-size: 12px;
  }
  
  .calendar-content-badge {
    font-size: 9px;
    padding: 2px 4px;
  }
}

@media (max-width: 480px) {
  .stats-container {
    grid-template-columns: 1fr;
  }
  
  .stat-card {
    padding: 16px;
  }
  
  table {
    font-size: 12px;
    min-width: 700px;
  }
  
  .calendar-day {
    min-height: 40px;
  }
}

/* Scrollbar Styles */
::-webkit-scrollbar {
  width: 8px;
  height: 8px;
}

::-webkit-scrollbar-track {
  background: var(--light-bg);
  border-radius: 10px;
}

::-webkit-scrollbar-thumb {
  background: var(--border-color);
  border-radius: 10px;
}

::-webkit-scrollbar-thumb:hover {
  background: var(--text-muted);
}

/* Touch-friendly elements */
@media (hover: none) and (pointer: coarse) {
  .btn,
  .btn-icon {
